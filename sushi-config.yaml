id: inera.ehds.ehds-tk
canonical: https://fhir.inera.se/ig/ehds-tk
name: SEEHDSTK
title: Inera EHDS Tjänstekontrakt – FHIR Implementation Guide
description: >-
  FHIR IG som beskriver hur Ineras RIVTA-tjänstekontrakt mappas till FHIR för
  att informationsförsörja NPÖ och 1177 Journal.
status: draft
version: 0.8.1
fhirVersion: 4.0.1
copyrightYear: 2024+
releaseLabel: ci-build
license: CC0-1.0
publisher:
  name: Inera AB
  url: https://www.inera.se
jurisdiction: urn:iso:std:iso:3166#SE "Sweden"
dependencies:
  # Fasta versioner för reproducerbara byggen (inga "current").
  # EURIDICE – EU Health Data API (IHE Europe/HL7 Europe). IG:n utlovar att vara en giltig profilering av denna.
  hl7.fhir.eu.health-data-api: 1.0.0-ballot
  # HL7 Europe Core – EURIDICE anger att datamodeller för resursåtkomst ärver från EU Core.
  # Samma version som health-data-api 1.0.0-ballot beror på.
  hl7.fhir.eu.base: 2.0.0-ballot
  # FHIR-extensions (t.ex. condition-related, flag-detail).
  hl7.fhir.uv.extensions.r4: 5.3.0
  # IHE Basic Audit Log Patterns – grund för loggprofilerna (auditloggning).
  ihe.iti.balp: 1.1.4
parameters:
  show-inherited-invariants: false
  usage-stats-opt-out: true
  # Kodsystem och ConceptMap som har en egen url utanför IG:ns canonical
  # (Instance: … InstanceOf: CodeSystem, se README avsnitt 4).
  special-url:
    - https://fhir.inera.se/CodeSystem/deliverycode
    - https://fhir.inera.se/CodeSystem/errorcode-actoutcome
    - https://fhir.inera.se/CodeSystem/examinationstatuscode
    - https://fhir.inera.se/CodeSystem/fetalpositioncode
    - https://fhir.inera.se/CodeSystem/nonreplaceable-actoutcome
    - https://fhir.inera.se/CodeSystem/prescriptionstatus
    - https://fhir.inera.se/CodeSystem/referraloutcometypecode
    - https://fhir.inera.se/CodeSystem/resultcode-actoutcome
    - https://fhir.inera.se/CodeSystem/sexcode
    - https://fhir.inera.se/CodeSystem/typeofcareplan-cs
    - https://fhir.inera.se/CodeSystem/typeofleavecode
    - https://fhir.inera.se/CodeSystem/typeofprescription
    - https://fhir.inera.se/CodeSystem/typeofresultcode
    - https://fhir.inera.se/ConceptMap/observation-status-map
    - https://fhir.inera.se/clinicalprocess-healthcond-description/CodeSystem/assessmentcategory-cs
    - https://terminologitjansten.inera.se/inera-kodverksforvaltning/kodverk/kv_diagnostyp
    - urn:oid:1.2.752.129.2.2.2.11
